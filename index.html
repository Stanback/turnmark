<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        let preference = "auto";
        try {
          const stored = localStorage.getItem("turnmark-theme");
          if (stored === "light" || stored === "dark") preference = stored;
        } catch {}
        document.documentElement.dataset.themePreference = preference;
        document.documentElement.dataset.theme =
          preference === "dark" ||
          (preference === "auto" &&
            matchMedia("(prefers-color-scheme: dark)").matches)
            ? "dark"
            : "light";
      })();
    </script>
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%BASE_URL%icons/favicon-192.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="%BASE_URL%favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%icons/icon-180.png"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#032c43" />
    <meta name="apple-mobile-web-app-title" content="Turnmark" />
    <meta
      name="description"
      content="Convert swim times between yards and meters (SCY, SCM, LCM). Compare USA Swimming and USMS standards, calculate World Aquatics points, and adjust for altitude."
    />
    <link rel="canonical" href="https://turnmark.app/" />
    <link rel="describedby" type="text/plain" href="/llms.txt" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Swim Time Converter: SCY, SCM & LCM | Turnmark"
    />
    <meta
      property="og:description"
      content="Compare swim times across pool courses, published youth and Masters standards, altitude adjustments, and World Aquatics points."
    />
    <meta property="og:url" content="https://turnmark.app/" />
    <meta property="og:site_name" content="Turnmark" />
    <meta
      property="og:image"
      content="https://turnmark.app/images/turnmark-social-v1.png"
    />
    <meta property="og:image:width" content="1200" />

      content="turnmark. Your swim. Any course. Swim time conversion, published standards and points, over luminous navy water."
    />

    <title>Swim Time Converter: SCY, SCM & LCM | Turnmark</title>
  </head>

  </body>
</html>
