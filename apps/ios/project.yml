name: Turnmark
options:
  bundleIdPrefix: net.stanback
  deploymentTarget:
    iOS: '17.0'
packages:
  TurnmarkCore:
    path: ../../packages/swift
settings:
  base:
    SWIFT_VERSION: '6.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '0.1.0'
targets:
  Turnmark:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
    dependencies:
      - package: TurnmarkCore
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: net.stanback.turnmark
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Turnmark
        TARGETED_DEVICE_FAMILY: '1,2'
  TurnmarkTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: ../history/contract-v1.json
        buildPhase: resources
      - path: ../history/import-cases.json
        buildPhase: resources
    dependencies:
      - target: Turnmark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TurnmarkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Turnmark
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Turnmark:
    build:
      targets:
        Turnmark: all
    test:
      testPlans:
        - path: Full.xctestplan
          defaultPlan: true
        - path: Smoke.xctestplan
