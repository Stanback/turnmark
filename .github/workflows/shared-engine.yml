name: Check shared engine
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-engine-${{ github.ref }}
  # Superseded PR checks can stop; main must finish its tested MCP deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Verify reviewed national benchmark snapshot
        run: python3 scripts/import-national-standards.py --check
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features turnmark-core/native -- -D warnings
      - run: cargo test --locked --workspace --features turnmark-core/native
  web-sdk:
    needs: [changes, core]
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:engine
      - run: npm run test:sdk:package
      - run: node scripts/engine-metrics.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engine-metrics
          path: target/engine-metrics.json
          retention-days: 7
  ios:
    needs: [changes, core]
    # A native-only edit intentionally skips core; a selected core must pass.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.ios == 'true' && (needs.core.result == 'success' || (needs.core.result == 'skipped' && needs.changes.outputs.core == 'false')) }}
    timeout-minutes: 45
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      TURNMARK_IOS_RUNTIME: "27"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify current stable Apple SDK
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = '27.1'
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Restore iOS Rust and compiler caches
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          # Explicit build directories: never cache simulator state or test results.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            !target/debug/incremental
            target/aarch64-apple-ios/release
            target/aarch64-apple-ios-sim/release
            target/x86_64-apple-ios/release
            target/xcode-compilation-cache
          key: native-ios-v1-${{ runner.os }}-${{ runner.arch }}-xcode27.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: native-ios-v1-${{ runner.os }}-${{ runner.arch }}-xcode27.1-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/config.toml') }}-
      - run: node scripts/package-ios.mjs
      - run: node scripts/test-native-host.mjs swift
      - run: node scripts/test-ios.mjs
      - name: Test unsigned native iOS app
        # The hosted runner's two-clone run was slower and hit UI timing failures.
        # Keep all cases; reserve two workers for measured local iterations.
        run: node scripts/test-ios.mjs app --workers 1
      - name: Save successful iOS build caches
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
            !target/debug/incremental
            target/aarch64-apple-ios/release
            target/aarch64-apple-ios-sim/release
            target/x86_64-apple-ios/release
            target/xcode-compilation-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-engine-tests
          path: |
            target/ios-tests.xcresult
            target/ios-app-tests.xcresult
            target/ios-*-metrics.json
          retention-days: 7
  android:
    needs: [changes, core]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.android == 'true' && (needs.core.result == 'success' || (needs.core.result == 'skipped' && needs.changes.outputs.core == 'false')) }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle build caching
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          # The explicit GitHub cache below refreshes task outputs on main.
          # No paid cache provider, configuration cache or Build Scan publication.
          cache-provider: external
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;30.0.16248370' 'platforms;android-37.0' 'build-tools;36.0.0' 'emulator' 'system-images;android-37.0;google_apis;x86_64'
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Restore Android Rust and Gradle build caches
        id: native-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            !~/.gradle/caches/keyrings
            ~/.gradle/wrapper
            target/debug
            !target/debug/incremental
            target/aarch64-linux-android/release
            target/x86_64-linux-android/release
          key: native-android-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-ndk30.0.16248370-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: native-android-v1-${{ runner.os }}-${{ runner.arch }}-jdk21-ndk30.0.16248370-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/Cargo.toml', '.cargo/config.toml', '**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}-
      - name: Generate Kotlin and Android native libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" node scripts/package-android.mjs
      - run: ./gradlew :sdk-android:assembleDebug :sdk-android:assembleDebugAndroidTest :app-android:assembleDebug :app-android:assembleDebugAndroidTest
      - run: node scripts/check-android-libraries.mjs
      - name: Enable KVM for emulator tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android SDK on the managed Pixel 2 API 37
        run: node scripts/test-android.mjs sdk --managed
      - name: Test Android app on the managed Pixel 2 API 37
        run: node scripts/test-android.mjs app --managed
      - name: Save successful Android build caches
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
            !~/.gradle/caches/keyrings
            ~/.gradle/wrapper
            target/debug
            !target/debug/incremental
            target/aarch64-linux-android/release
            target/x86_64-linux-android/release
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-engine-tests
          path: |
            packages/android/build/reports/androidTests/
            packages/android/build/outputs/androidTest-results/
            apps/android/build/reports/androidTests/
            apps/android/build/outputs/androidTest-results/
            target/android-*-metrics.json
          retention-days: 7
  mcp:
    needs: [changes, core]
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mcp
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mcp-apps-browser-review
          path: target/mcp-ui-review/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build --workspace @turnmark/mcp-worker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: mcp-worker-${{ github.sha }}
          path: target/mcp-worker/
          if-no-files-found: error
          retention-days: 7
  mcp-deploy:
    needs: [mcp, engine-ci]
    # Override implicit success(): unchanged native jobs may be skipped upstream.
    # Both the MCP bundle and the complete selected-check gate must still pass.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.mcp.result == 'success' && needs.engine-ci.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-mcp-production
      url: https://mcp.turnmark.app/mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deployment/
            /packages/mcp-worker/wrangler.jsonc
            /packages/mcp/package.json
            /packages/mcp/src/server.ts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcp-worker-${{ github.sha }}
          path: target/mcp-worker/
      - run: npm ci --prefix deployment --ignore-scripts
      - name: Upload the tested bundle without building or changing routes
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TURNMARK_MCP_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7daa807beaaf490bed57ae3ebeb16444
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/mcp-version.jsonl
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node deployment/node_modules/wrangler/bin/wrangler.js versions upload target/mcp-worker/index.js --no-bundle --config packages/mcp-worker/wrangler.jsonc --tag "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const records = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(line => JSON.parse(line));
          const uploaded = records.filter(record => record.type === 'version-upload').at(-1);
          if (uploaded?.worker_name !== 'turnmark-mcp' || !/^[0-9a-f-]{36}$/.test(uploaded?.version_id ?? '')) throw new Error('Unexpected Worker version');
          appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + uploaded.version_id + '\n');
          JS
      - name: Deploy exactly the uploaded version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TURNMARK_MCP_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7daa807beaaf490bed57ae3ebeb16444
          WRANGLER_SEND_METRICS: "false"
          VERSION_ID: ${{ steps.upload.outputs.version }}
        run: node deployment/node_modules/wrangler/bin/wrangler.js versions deploy "$VERSION_ID@100" --yes --config packages/mcp-worker/wrangler.jsonc --message "$GITHUB_SHA"
      - name: Verify service, conversion and Apps resource
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://mcp.turnmark.app/ -o /dev/null
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          // Read metadata without executing application code on the deploy runner.
          const source = readFileSync('packages/mcp/src/server.ts', 'utf8');
          const uri = source.match(/export const conversionResourceUri = "([^"]+)";/)?.[1];
          assert.match(uri ?? '', /^ui:\/\/turnmark\/conversion\/[\w.-]+\.html$/);
          async function rpc(method, params) {
            const response = await fetch('https://mcp.turnmark.app/mcp', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json, text/event-stream' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 2, method, params }),
              signal: AbortSignal.timeout(15000),
            });
            assert.equal(response.status, 200);
            const raw = (await response.text()).trim();
            const body = JSON.parse(raw.startsWith('{') ? raw : raw.split(/\r?\n/).filter(line => line.startsWith('data: ')).map(line => line.slice(6)).join('\n'));
            assert.ok(!body.error); return body.result;
          }
          async function verify() {
            const body = await rpc('tools/list', {});
            assert.deepEqual(body.tools.map(t => t.name).sort(), ['adjust_altitude','assess_swim_benchmark','convert_swim','get_masters_target','get_sources','get_world_points','get_youth_standards']);
            assert.equal(body.tools.find(t => t.name === 'convert_swim')._meta.ui.resourceUri, uri);
            for (const name of ['assess_swim_benchmark', 'get_world_points']) {
              assert.ok(body.tools.find(t => t.name === name).inputSchema.properties.preview, name + ' must expose explicit previews');
            }
            const resource = (await rpc('resources/read', { uri })).contents[0];
            assert.equal(resource.mimeType, 'text/html;profile=mcp-app');
            assert.ok(resource.text.includes('Update comparison'), 'Apps resource must include its update control');
            assert.ok(Buffer.byteLength(resource.text) <= 750000);
            assert.deepEqual(resource._meta.ui.csp, { connectDomains: [], resourceDomains: [], frameDomains: [] });
            const swim = { time: '58.32', event: { distance: 100, stroke: 'freestyle', course: 'SCY' } };
            const calculation = await rpc('tools/call', { name: 'convert_swim', arguments: { swim, to: 'LCM', table: 'women' } });
            assert.equal(calculation.structuredContent.value.time, '1:06.72');
            for (const name of ['get_world_points', 'assess_swim_benchmark']) {
              const result = await rpc('tools/call', { name, arguments: {
                swim, table: 'women', preview: { to: 'LCM' },
                ...(name === 'assess_swim_benchmark' ? { system: 'futures', age: '18 & under' } : {}),
              } });
              assert.ok(!result.isError);
              assert.equal(result.structuredContent.status, 'available');
              const context = result.structuredContent.assessmentContext;
              assert.equal(context.basis, 'converted-estimate');
              assert.deepEqual(context.originalSwim, swim);
              assert.equal(context.assessedSwim.time, '1:06.72');
              assert.equal(context.assessedSwim.event.course, 'LCM');
            }
          }
          // A successful rollout can briefly serve the previous version at an edge.
          // Require the entire current contract to pass; never accept stale metadata.
          for (let attempt = 0; attempt < 12; attempt++) {
            try { await verify(); break; }
            catch (error) {
              if (attempt === 11) throw error;
              console.warn('MCP live verification pending; retrying in 5 seconds (' + (attempt + 1) + '/12).');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
          }
          console.log('Public MCP conversion, previews and Apps resource verified.');
          JS
  engine-ci:
    if: always()
    needs: [changes, core, web-sdk, ios, android, mcp]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          const selected = jobs.changes.outputs;
          const consumers = { core: 'core', 'web-sdk': 'core', mcp: 'core', ios: 'ios', android: 'android' };
          if (jobs.changes.result !== 'success' || Object.entries(consumers).some(([job, flag]) =>
              !['true', 'false'].includes(selected?.[flag]) ||
              jobs[job]?.result !== (selected[flag] === 'true' ? 'success' : 'skipped'))) {
            process.exit(1);
          }
          JS
