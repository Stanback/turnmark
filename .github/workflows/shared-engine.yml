name: Check shared engine
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-engine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --features turnmark-core/native -- -D warnings
      - run: cargo test --locked --workspace --features turnmark-core/native
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:engine
      - run: npm run test:sdk:package
      - run: node scripts/engine-metrics.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: engine-metrics
          path: target/engine-metrics.json
          retention-days: 7
  ios:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - run: node scripts/package-ios.mjs
      - run: node scripts/test-native-host.mjs swift
      - run: node scripts/test-ios.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-engine-tests
          path: target/ios-tests.xcresult
          retention-days: 7
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'ndk;30.0.16248370' 'platforms;android-36' 'build-tools;36.0.0'
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Generate Kotlin and Android native libraries
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" node scripts/package-android.mjs
      - run: ./gradlew :sdk-android:assembleDebug :sdk-android:assembleDebugAndroidTest
      - run: node scripts/check-android-libraries.mjs
      - name: Enable KVM for emulator tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: default
          arch: x86_64
          disable-animations: true
          script: ./gradlew :sdk-android:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-engine-tests
          path: packages/android/build/reports/androidTests/
          retention-days: 7
