name: Check and publish Turnmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: turnmark-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  check-and-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:sdk:package
      - run: npm run test:browser
      - name: Install isolated deployment tooling without lifecycle scripts
        run: npm ci --prefix deployment --ignore-scripts
      - run: npm run test:production
      - name: Validate static deployment without Cloudflare credentials
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node deployment/node_modules/wrangler/bin/wrangler.js versions upload --dry-run --no-bundle --config wrangler.jsonc
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: website-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [check-and-build, web-ci]
    timeout-minutes: 10
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-production
      url: https://turnmark.app
    # A new runner receives only deployment tooling and the tested static
    # artifact. Application dependencies and build scripts never receive a token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /deployment/
            /wrangler.jsonc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: website-${{ github.sha }}
          path: dist/
      - name: Install pinned deployment tooling without lifecycle scripts
        run: npm ci --prefix deployment --ignore-scripts
      - name: Upload a version without changing domains or routes
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TURNMARK_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7daa807beaaf490bed57ae3ebeb16444
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/turnmark-version.jsonl
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node deployment/node_modules/wrangler/bin/wrangler.js versions upload --no-bundle --config wrangler.jsonc --tag "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const records = readFileSync(process.env.WRANGLER_OUTPUT_FILE_PATH, 'utf8').trim().split('\n').map(line => JSON.parse(line));
          const uploaded = records.filter(record => record.type === 'version-upload').at(-1);
          if (uploaded?.worker_name !== 'turnmark-web' || !/^[0-9a-f-]{36}$/.test(uploaded?.version_id ?? '')) {
            throw new Error('Missing expected Turnmark version; refusing to deploy');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + uploaded.version_id + '\n');
          JS
      - name: Deploy exactly the uploaded version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TURNMARK_WORKER_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 7daa807beaaf490bed57ae3ebeb16444
          WRANGLER_SEND_METRICS: "false"
          VERSION_ID: ${{ steps.upload.outputs.version }}
        run: node deployment/node_modules/wrangler/bin/wrangler.js versions deploy "$VERSION_ID@100" --yes --config wrangler.jsonc --message "$GITHUB_SHA"
      - name: Verify the production response
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 https://turnmark.app/ -o /dev/null
  legacy-redirect:
    needs: deploy
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://stanback.github.io/turnmark/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /deployment/legacy-pages/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: deployment/legacy-pages
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
  web-ci:
    if: always()
    needs: [changes, check-and-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          const jobs = JSON.parse(process.env.RESULTS);
          if (jobs.changes.result !== 'success' ||
              Object.values(jobs).some(({ result }) => !['success', 'skipped'].includes(result))) {
            process.exit(1);
          }
          JS
