name: Prepare or publish SDK
on:
  workflow_dispatch:
    inputs:
      version:
        description: SDK version already committed on main (for example 0.1.0)
        required: true
        type: string
      publish:
        description: Publish the verified tarball using npm trusted publishing
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sdk-release
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Stanback/turnmark' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const sdk = JSON.parse(readFileSync('packages/sdk/package.json', 'utf8'));
          const cargo = readFileSync('Cargo.toml', 'utf8');
          assert.match(process.env.RELEASE_VERSION, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/);
          assert.equal(sdk.name, '@turnmark/sdk');
          assert.equal(sdk.private, false);
          assert.equal(sdk.version, process.env.RELEASE_VERSION);
          assert.equal(cargo.match(/^version = "([^"]+)"/m)?.[1], sdk.version);
          JS
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:engine
      - name: Test the exact tarball retained for publishing
        run: npm run pack:sdk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: prepare
    if: inputs.publish && github.repository == 'Stanback/turnmark' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, application dependencies, install scripts, or stored token
      # execute on the runner that has publishing identity.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-${{ github.sha }}
          path: release/
      - name: Verify npm supports trusted publishing
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const [major, minor, patch] = execFileSync('npm', ['--version'], {encoding:'utf8'}).trim().split('.').map(Number);
          assert.ok(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))));
          JS
      - name: Publish the same-run artifact without lifecycle scripts
        working-directory: release
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          sha256sum --check SHA256SUMS
          npm publish "turnmark-sdk-$RELEASE_VERSION.tgz" --ignore-scripts --access public --provenance
